name: Release

# Push a tag like v1.0.1 to build WinLoc27.exe and publish it as a GitHub Release.
# The app's updater looks for the WinLoc27.exe and WinLoc27.exe.sha256 assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish WinLoc27/WinLoc27.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=$v -o dist
          (Get-FileHash dist/WinLoc27.exe -Algorithm SHA256).Hash.ToLower() |
            Out-File -NoNewline -Encoding ascii dist/WinLoc27.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WinLoc27.exe
            dist/WinLoc27.exe.sha256
          generate_release_notes: true
